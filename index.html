<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <meta name="description" content="Create clear ISO 4 abbreviations for journal and publication titles.">
  <title>Journal Title Abbreviator</title>
  <script
    src="https://code.jquery.com/jquery-3.2.1.min.js"
    integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4="
    crossorigin="anonymous"></script>
  <script src="browserBundle.js"></script>

  <style>
    :root {
      color-scheme: light;
      --ink: #242725;
      --muted: #707671;
      --line: #e3e5e3;
      --accent: #315e4a;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 58px 24px;
      background: #fff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 640px);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.035em;
    }

    .intro {
      margin: 9px 0 34px;
      color: var(--muted);
      font-size: 15px;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    label, .section-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 104px;
      padding: 13px 14px;
      resize: vertical;
      border: 1px solid #d4d8d5;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    textarea:focus {
      border-color: var(--accent);
      outline: 2px solid rgba(49, 94, 74, 0.12);
    }

    .status {
      min-height: 16px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status:empty { display: none; }

    .output-section { margin-top: 32px; }

    .outputs { border-top: 1px solid var(--line); }

    .output-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 84px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .output-copy { min-width: 0; }

    .output-label {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .output-value {
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5;
    }

    .output-value:empty::before {
      color: #a0a5a1;
      content: "—";
    }

    .copy-button {
      flex: 0 0 auto;
      min-width: 68px;
      padding: 7px 10px;
      border: 1px solid #d8dcd9;
      border-radius: 5px;
      background: #fff;
      color: #454b47;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .copy-button:hover:not(:disabled) {
      border-color: #9ca69f;
      background: #f8f9f8;
    }

    .copy-button:focus-visible {
      outline: 2px solid rgba(49, 94, 74, 0.35);
      outline-offset: 2px;
    }

    .copy-button:disabled {
      color: #a0a5a1;
      cursor: default;
    }

    @media (max-width: 520px) {
      body { padding: 38px 18px; }
      h1 { font-size: 27px; }
      .output-row { gap: 12px; }
    }
  </style>

  <script>
    'use strict';
    /** @type {AbbrevIso.AbbrevIso} */
    let abbrevIso;

    function debounce(f, wait) {
      let timeout;
      return function() {
        const context = this; /* eslint-disable-line no-invalid-this */
        const args = arguments; /* eslint-disable-line prefer-rest-params */
        clearTimeout(timeout);
        timeout = setTimeout(() => f.apply(context, args), wait);
      };
    }

    function onInputChange() {
      const value = $('#inputText').val();
      if (value.trim().length < 4) {
        $('#resultString, #resultNoDots').text('');
        $('.copy-button').prop('disabled', true).text('Copy');
        return;
      }

      const result = abbrevIso.makeAbbreviation(value);
      $('#resultString').text(result);
      $('#resultNoDots').text(result.replace(/\./g, ''));
      $('.copy-button').prop('disabled', false).text('Copy');
    }

    async function copyText(value) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(value);
          return;
        } catch (error) {
          // Try the local fallback if clipboard permissions are unavailable.
        }
      }

      const copyField = document.createElement('textarea');
      copyField.value = value;
      copyField.setAttribute('readonly', '');
      copyField.style.position = 'fixed';
      copyField.style.left = '-9999px';
      document.body.appendChild(copyField);
      copyField.select();
      const copied = document.execCommand('copy');
      copyField.remove();
      if (!copied) throw new Error('Copy failed');
    }

    async function copyOutput(button) {
      const output = document.getElementById(button.dataset.target);
      const originalLabel = button.textContent;
      const originalAccessibleLabel = button.getAttribute('aria-label');
      try {
        await copyText(output.textContent);
        button.textContent = 'Copied';
        button.setAttribute('aria-label', 'Copied to clipboard');
        window.setTimeout(() => {
          button.textContent = originalLabel;
          button.setAttribute('aria-label', originalAccessibleLabel);
        }, 1200);
      } catch (error) {
        button.textContent = 'Failed';
        button.setAttribute('aria-label', 'Copy failed, try again');
        window.setTimeout(() => {
          button.textContent = originalLabel;
          button.setAttribute('aria-label', originalAccessibleLabel);
        }, 1600);
      }
    }

    $(document).ready(function() {
      const defaultTitle = 'International Journal of Geographical Information Science';
      const search = new URLSearchParams(window.location.search).get('search');
      if (search)
        $('#inputText').val(search.replace(/_/g, ' '));
      else
        $('#inputText').val(defaultTitle);

      const ltwaAjax = $.ajax({
        mimeType: 'text/plain; charset=utf-8',
        url: 'LTWA_2024-modified.csv',
        dataType: 'text',
      });
      const shortWordsAjax = $.ajax({
        mimeType: 'text/plain; charset=utf-8',
        url: 'shortwords.txt',
        dataType: 'text',
      });
      $('#status').text('Loading abbreviation data…');

      $('#inputText').on('input', debounce(function() {
        if (!abbrevIso) return;
        onInputChange();
      }, 180));

      $.when(ltwaAjax, shortWordsAjax).done((ltwa, shortWords) => {
        abbrevIso = new AbbrevIso.AbbrevIso(ltwa[0], shortWords[0]);
        onInputChange();
        $('#status').text('');
      }).fail(() => {
        $('#status').text('Could not load the abbreviation data. Refresh the page to try again.');
      });
    });
  </script>
</head>
<body>
  <main>
    <header>
      <h1>Journal title abbreviator</h1>
      <p class="intro">ISO 4 abbreviations for journal and publication titles.</p>
    </header>

    <section aria-labelledby="inputHeading">
      <div class="panel-heading">
        <label id="inputHeading" for="inputText">Publication title</label>
      </div>
      <textarea id="inputText" spellcheck="false" aria-describedby="status">International Journal of Geographical Information Science</textarea>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="output-section" aria-labelledby="outputHeading">
      <div class="panel-heading">
        <h2 class="section-title" id="outputHeading">Abbreviation</h2>
      </div>
      <div class="outputs" aria-live="polite">
        <div class="output-row">
          <div class="output-copy">
            <p class="output-label">With periods</p>
            <p id="resultString" class="output-value"></p>
          </div>
          <button class="copy-button" type="button" data-target="resultString" aria-label="Copy abbreviation with periods" disabled>Copy</button>
        </div>
        <div class="output-row">
          <div class="output-copy">
            <p class="output-label">Without periods</p>
            <p id="resultNoDots" class="output-value"></p>
          </div>
          <button class="copy-button" type="button" data-target="resultNoDots" aria-label="Copy abbreviation without periods" disabled>Copy</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    document.querySelectorAll('.copy-button').forEach(button => {
      button.addEventListener('click', () => copyOutput(button));
    });
  </script>
</body>
</html>
